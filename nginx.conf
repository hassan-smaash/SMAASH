server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The HTML shell must never be cached, so a redeploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # App code: the filenames aren't content-hashed (01-runtime.js, …), so caching
    # them would serve stale code after a rebuild. "no-cache" = the browser revalidates
    # every load (fast 304 if unchanged), so a new build always shows up. A MISSING file
    # must 404 — never fall back to index.html, or a bad /js path serves HTML and breaks
    # the app with "Unexpected token '<'".
    location ~* \.(?:js|mjs|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Static media (icons, fonts, manifest) rarely change — safe to cache briefly.
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|json|webmanifest|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # SPA routes: anything else falls back to the app shell so History-API routes
    # (/more, /community, /t/<slug>) work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
