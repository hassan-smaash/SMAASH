<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/><meta http-equiv="Pragma" content="no-cache"/><meta http-equiv="Expires" content="0"/><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="theme-color" content="var(--bg)"/><title>SMAASH</title><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/><style>*{margin:0;padding:0;box-sizing:border-box;}body{background:var(--bg,#020810);color:var(--text,#f1f5f9);font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased;}#root{min-height:100vh;}</style>
<script>
// SMAASH theme — resolves initial theme, persists changes, exposes window.smaashTheme.
(function() {
  const TOKENS = {
    dark: {
      bg:'#020810', surface:'#0f172a', sunken:'#080f1d',
      border:'#1e293b', borderStrong:'#334155',
      text:'#f1f5f9', textMuted:'#94a3b8', textDim:'#64748b', textFaint:'#475569',
      primary:'#22d3ee', primaryDeep:'#0e7490',
      success:'#22c55e', warn:'#f59e0b', danger:'#ef4444', purple:'#a78bfa',
    },
    light: {
      bg:'#f5f6f8', surface:'#ffffff', sunken:'#f1f2f5',
      border:'#e4e6eb', borderStrong:'#cfd3da',
      text:'#0b1220', textMuted:'#475569', textDim:'#64748b', textFaint:'#8794a8',
      primary:'#0891b2', primaryDeep:'#155e75',
      success:'#15803d', warn:'#c2410c', danger:'#dc2626', purple:'#7c3aed',
    },
  };
  function resolve() {
    try { const saved = localStorage.getItem('smaash_theme'); if (saved === 'light' || saved === 'dark') return saved; } catch (e) {}
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
    return 'dark';
  }
  const listeners = new Set();
  let current = resolve();
  window.smaashTheme = {
    get: () => current,
    tokens: () => TOKENS[current],
    set(name) {
      if (name !== 'light' && name !== 'dark') return;
      current = name;
      try { localStorage.setItem('smaash_theme', name); } catch (e) {}
      listeners.forEach(fn => fn(name));
      applyRoot();
    },
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
  };
  function applyRoot() {
    const t = TOKENS[current];
    const root = document.documentElement;
    Object.entries(t).forEach(([k, v]) => {
      const cssName = '--' + k.replace(/[A-Z]/g, m => '-' + m.toLowerCase());
      root.style.setProperty(cssName, v);
    });
    // body may not exist yet when script runs in <head>, so guard it
    if (document.body) {
      document.body.style.background = t.bg;
      document.body.style.color = t.text;
    } else {
      document.addEventListener('DOMContentLoaded', function() {
        document.body.style.background = t.bg;
        document.body.style.color = t.text;
      });
    }
  }
  applyRoot();
})();
</script>
</head>
